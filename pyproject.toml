[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reponexus"
version = "0.1.0"
description = "CLI tool to generate Mermaid.js architecture diagrams by analyzing local repositories"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "RepoNexus Contributors"}
]
dependencies = []

[project.scripts]
reponexus = "reponexus.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reponexus*"]
